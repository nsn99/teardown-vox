# Волны issues для «Тирдауна».
#
# Правила:
#   status: done      — уже реализовано и покрыто тестами (issue создаётся закрытой при --close-done)
#   status: partial   — часть готова, в теле указано, что именно осталось
#   status: todo      — не начато
#
# Заливка: node tools/issues/sync-issues.mjs --repo <owner>/<name>

labels:
  - { name: "волна:0",  color: "ededed", description: "Фундамент проекта" }
  - { name: "волна:1",  color: "d4c5f9", description: "Воксельное ядро" }
  - { name: "волна:2",  color: "d4c5f9", description: "Разрушение" }
  - { name: "волна:3",  color: "d4c5f9", description: "Структурная целостность" }
  - { name: "волна:4",  color: "d4c5f9", description: "Огонь и вода" }
  - { name: "волна:5",  color: "d4c5f9", description: "Твёрдые тела" }
  - { name: "волна:6",  color: "c2e0c6", description: "Рендер" }
  - { name: "волна:7",  color: "c2e0c6", description: "Игрок и инструменты" }
  - { name: "волна:8",  color: "c2e0c6", description: "Техника" }
  - { name: "волна:9",  color: "fef2c0", description: "Игровая логика" }
  - { name: "волна:10", color: "fef2c0", description: "Хаб и прогрессия" }
  - { name: "волна:11", color: "fbca04", description: "Карта M" }
  - { name: "волна:12", color: "e99695", description: "Полировка и приёмка" }
  - { name: "ядро",       color: "1d76db", description: "packages/core" }
  - { name: "игра",       color: "0e8a16", description: "packages/game" }
  - { name: "рендер",     color: "5319e7", description: "packages/render" }
  - { name: "приложение", color: "006b75", description: "apps/web" }
  - { name: "тесты",      color: "bfd4f2", description: "Покрытие и регрессия" }
  - { name: "производительность", color: "d93f0b", description: "Бюджеты кадра" }
  - { name: "контент",    color: "f9d0c4", description: "Уровни и наполнение" }

milestones:
  - { title: "Волна 0 — Фундамент",              description: "Монорепо, CI, тестовый харнес, соглашения" }
  - { title: "Волна 1 — Воксельное ядро",        description: "Формы, тела, мир, трассировка, сериализация" }
  - { title: "Волна 2 — Разрушение",             description: "Кисти, модель урона, взрывы, разметка" }
  - { title: "Волна 3 — Структурная целостность", description: "Связность от якорей и модель нагрузок" }
  - { title: "Волна 4 — Огонь и вода",           description: "Распространение, обугливание, тушение, акватория" }
  - { title: "Волна 5 — Твёрдые тела",           description: "Rapier, коллайдеры, импульсы, удары" }
  - { title: "Волна 6 — Рендер",                 description: "Меширование, освещение, эффекты" }
  - { title: "Волна 7 — Игрок и инструменты",    description: "Ввод, камера, HUD, применение инструментов" }
  - { title: "Волна 8 — Техника",                description: "Управление, камера, взаимодействие с вокселями" }
  - { title: "Волна 9 — Игровая логика",         description: "Миссия, тревога, эвакуация, экономика" }
  - { title: "Волна 10 — Хаб и прогрессия",      description: "Магазин, ступени, сохранения, песочница" }
  - { title: "Волна 11 — Карта M",               description: "Порт: наполнение, маршруты, реиграбельность" }
  - { title: "Волна 12 — Полировка и приёмка",   description: "Перф-бюджеты, видео состояний, регрессия" }

issues:
  # ---------------------------------------------------------------- волна 0
  - title: "Монорепо, TypeScript strict и рабочие пространства npm"
    milestone: "Волна 0 — Фундамент"
    labels: ["волна:0"]
    status: done
    body: |
      Каркас: `packages/core`, `packages/game`, `packages/render`, `apps/web`
      как npm workspaces, общий `tsconfig.base.json` со strict.

      **Приёмка**
      - `npm run typecheck` проходит без ошибок на всех пакетах;
      - импорт `@tvox/core` работает и из тестов, и из приложения;
      - ни один пакет не тянет DOM-типы в код, который должен работать headless.

  - title: "Тестовый харнес vitest с порогами покрытия"
    milestone: "Волна 0 — Фундамент"
    labels: ["волна:0", "тесты"]
    status: done
    body: |
      Единый прогон `npm test`, покрытие только по `packages/core` и
      `packages/game` — рендер проверяется иначе.

      **Приёмка**
      - пороги 90% строк / 85% ветвей падают сборку при снижении;
      - `npm run test:cov` печатает таблицу по файлам;
      - алиасы пакетов работают в тестах без сборки.

  - title: "CI: типы, линт, тесты, сборка на каждый push"
    milestone: "Волна 0 — Фундамент"
    labels: ["волна:0"]
    status: done
    body: |
      GitHub Actions: `typecheck` → валидация `waves.yaml` → `test:cov` →
      `build` → дымовой прогон в Chromium. Кэш npm.

      **Приёмка**
      - падение любого шага блокирует merge;
      - отчёт покрытия и скриншоты прикладываются артефактами;
      - время прогона на чистом кэше не больше 5 минут.

  # ---------------------------------------------------------------- волна 1
  - title: "VoxelShape: сетка материалов, грязные области, геометрия"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро"]
    status: done
    body: |
      Прямоугольная воксельная форма с собственным трансформом, счётчиком
      непустых вокселей, буфером накопленного урона и слоем краски.

      **Приёмка**
      - `idx`/`coords` взаимно обратны на всём объёме;
      - запись за границами игнорируется, чтение возвращает воздух;
      - `solidVoxels` поддерживается инкрементально и совпадает с пересчётом;
      - масса и центр масс считаются из плотности материалов.

  - title: "Тела и мир: контейнеры форм, шина событий, запросы"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро"]
    status: done
    body: |
      `Body` — набор форм с общим трансформом; `VoxelWorld` — тела,
      типизированная шина событий, индекс «форма → тело», сборка мусора.

      **Приёмка**
      - добавление и удаление тела шлёт события ровно один раз;
      - пустое динамическое тело собирается сборщиком, статическое — нет;
      - отписка обработчика во время доставки не ломает обход.

  - title: "Таблица материалов: прочность, горючесть, пределы, вид"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро"]
    status: done
    body: |
      Один байт на воксель. Для каждого материала: плотность, порог
      инструмента, hp, горючесть и топливо, пределы сжатия и изгиба,
      признаки якоря и неразрушимости, цвет и параметры PBR.

      **Приёмка**
      - в таблице нет дыр, неизвестный id даёт ошибку;
      - фундамент неразрушим и якорит;
      - металл прочнее дерева, дерево горит, металл — нет;
      - числа задокументированы: видно, откуда взялся каждый предел.

  - title: "DDA-трассировка луча по вокселям и по миру"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро"]
    status: done
    body: |
      Amanatides & Woo в локальном пространстве формы, поиск ближайшего
      попадания по всем телам с учётом поворотов.

      **Приёмка**
      - нормаль грани всегда направлена против луча;
      - луч из точки внутри материала попадает на нулевой дистанции;
      - фильтр материалов пропускает неподходящие воксели;
      - ограничение дальности отсекает попадание.

  - title: "Сериализация карт: RLE и круговой рейс через JSON"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро"]
    status: done
    body: |
      Воксельные карты состоят из длинных однородных пробегов, поэтому RLE.

      **Приёмка**
      - форма и тело переживают круговой рейс без потерь;
      - RLE длиннее или короче буфера отвергается с понятной ошибкой;
      - размер сохранения карты «Порт» — единицы мегабайт, не десятки.

  - title: "Чанковая нарезка больших форм под ремеш и стриминг"
    milestone: "Волна 1 — Воксельное ядро"
    labels: ["волна:1", "ядро", "производительность"]
    status: done
    body: |
      Сейчас грязная область — один AABB на форму. Для карты в сотни тысяч
      вокселей нужен список грязных чанков 32³, иначе один удар кувалдой
      заставляет перестраивать весь склад.

      **Приёмка**
      - удар в угол формы помечает грязным один чанк, а не всю форму;
      - список грязных чанков не растёт без ограничения;
      - тест: 1000 случайных ударов дают суммарно меньше N перестроек.

  # ---------------------------------------------------------------- волна 2
  - title: "Кисти разрушения: сфера, бокс, капсула, конус"
    milestone: "Волна 2 — Разрушение"
    labels: ["волна:2", "ядро"]
    status: done
    body: |
      Кисти задаются в мировых координатах и переводятся в локальное
      пространство каждой формы.

      **Приёмка**
      - сфера снимает объём, близкий к теоретическому шару;
      - повёрнутый бокс режет вдоль своей оси, а не мировой;
      - конус расширяется от вершины и не достаёт за свою длину;
      - кисть тоньше вокселя всё равно берёт хотя бы одну клетку.

  - title: "Модель урона: порог инструмента против прочности материала"
    milestone: "Волна 2 — Разрушение"
    labels: ["волна:2", "ядро"]
    status: done
    body: |
      Главное правило Teardown: инструмент либо берёт материал, либо нет —
      сколько ни бей. Накопительный режим для инструментов, мгновенный
      для взрывов (там ослабление входит в порог и формирует воронку).

      **Приёмка**
      - кувалда не берёт сталь ни за 200 ударов;
      - паяльная лампа сталь режет;
      - слабый удар копит урон, серия — сносит воксель;
      - два одинаковых прогона совпадают воксель в воксель.

  - title: "Взрывы: мгновенная воронка, импульс телам, поджиг"
    milestone: "Волна 2 — Разрушение"
    labels: ["волна:2", "ядро"]
    status: done
    body: |
      **Приёмка**
      - квадратичное ослабление даёт воронку меньше линейного;
      - фундамент не берётся даже кратной силой;
      - защищённые материалы (цели миссии) не трогаются;
      - взрыв поджигает горючее в радиусе.

  - title: "Разметка баллончиком отдельным слоем"
    milestone: "Волна 2 — Разрушение"
    labels: ["волна:2", "ядро"]
    status: done
    body: |
      Краска не меняет материал: разметка маршрута не должна ослаблять стену.

      **Приёмка**
      - число вокселей после покраски не меняется;
      - красятся только поверхностные воксели;
      - повторная покраска тем же цветом ничего не добавляет;
      - удаление вокселя стирает его краску.

  - title: "Бюджет разрушения за кадр и отложенная доработка"
    milestone: "Волна 2 — Разрушение"
    labels: ["волна:2", "ядро", "производительность"]
    status: done
    body: |
      Большой взрыв в плотной геометрии может снять сотни тысяч вокселей
      за один вызов. Нужна очередь: часть в этом кадре, часть в следующем.

      **Приёмка**
      - кадр не проседает ниже бюджета при заряде максимальной ступени;
      - визуально разрушение выглядит одномоментным, без «дорисовки» на глазах;
      - есть тест на то, что суммарный результат отложенного разрушения
        совпадает с результатом мгновенного.

  # ---------------------------------------------------------------- волна 3
  - title: "Связность от якорей: отсоединённое становится динамическим"
    milestone: "Волна 3 — Структурная целостность"
    labels: ["волна:3", "ядро"]
    status: done
    body: |
      Флад-филл 6-связностью от якорных вокселей (фундамент, скала, грунт,
      нижний слой заземлённой формы). Всё, что не достало до якоря, режется
      в отдельные динамические тела.

      **Приёмка**
      - подпиленная колонна роняет плиту ровно одним обломком;
      - обломок оказывается ровно там, где был, — в кадре ничего не прыгает;
      - мост, подрезанный с одного конца, держится вторым;
      - касание углом опорой не считается;
      - суммарное число вокселей при обрушении сохраняется.

  - title: "Модель нагрузок: сжатие и изгиб с распределением по опорам"
    milestone: "Волна 3 — Структурная целостность"
    labels: ["волна:3", "ядро"]
    status: done
    body: |
      Вертикальная передача веса вниз плюс латеральное распределение
      висящих участков по ВСЕМ опорам своего куска. Наивная передача по
      дереву BFS сливает половину крыши в один воксель и складывает здание
      само собой — так делать нельзя. Изгиб проверяется в корневом сечении
      консоли, а не в опоре.

      **Приёмка**
      - стоящая конструкция не разрушает сама себя;
      - длинная деревянная консоль отламывается, короткая держится;
      - стальная той же длины выдерживает;
      - стекло держит сжатие и не держит изгиб;
      - множитель нагрузки усиливает обрушение предсказуемо.

  - title: "Инкрементальный структурный анализ по грязным чанкам"
    milestone: "Волна 3 — Структурная целостность"
    labels: ["волна:3", "ядро", "производительность"]
    status: done
    body: |
      Сейчас грязная форма пересчитывается целиком. Для карты в сотни тысяч
      вокселей это десятки миллисекунд на удар.

      **Приёмка**
      - пересчёт ограничен затронутой областью плюс связная окрестность;
      - результат совпадает с полным пересчётом на наборе сценариев;
      - профиль: удар по стене склада укладывается в бюджет кадра.

  - title: "Обломки второго порядка: падающая плита ломает то, на что упала"
    milestone: "Волна 3 — Структурная целостность"
    labels: ["волна:3", "ядро"]
    status: done
    body: |
      Урон от удара по импульсу уже есть в headless-физике. Нужно довести
      до цепочки: обломок падает → пробивает перекрытие → перекрытие теряет
      опору → падает дальше.

      **Приёмка**
      - тяжёлая плита с высоты пробивает деревянное перекрытие;
      - лёгкий ящик с малой высоты не ломает ничего;
      - цепочка из трёх этажей обрушается за конечное число шагов и не зацикливается.

  # ---------------------------------------------------------------- волна 4
  - title: "Распространение огня: детерминированный клеточный автомат"
    milestone: "Волна 4 — Огонь и вода"
    labels: ["волна:4", "ядро"]
    status: done
    body: |
      Горит только поверхность, вверх охотнее, ветер сдвигает фронт.
      Весь недетерминизм — через сид, чтобы спидран воспроизводился.

      **Приёмка**
      - огонь расползается по деревянной стене и не трогает металл;
      - дерево обугливается и только потом исчезает;
      - одинаковый сид даёт идентичный пожар, разные — разные;
      - лимит одновременно горящих вокселей соблюдается.

  - title: "Тушение: пена, влажность, повторное возгорание"
    milestone: "Волна 4 — Огонь и вода"
    labels: ["волна:4", "ядро"]
    status: done
    body: |
      **Приёмка**
      - огнетушитель гасит очаг и оставляет мокрое пятно;
      - мокрый воксель не поджечь;
      - влага испаряется, и материал снова горюч;
      - слабая струя сбивает жар, но не тушит полностью.

  - title: "Вода: акватория, выталкивание, плавучесть техники"
    milestone: "Волна 4 — Огонь и вода"
    labels: ["волна:4", "ядро", "игра"]
    status: done
    body: |
      Есть материал воды, пассивное тело акватории, плавание игрока и
      привязка катера к уровню воды. Не хватает: волн, брызг, затопления
      пробитого корпуса, растекания при разрушении дамбы.

      **Приёмка**
      - игрок в воде замедляется и всплывает по пробелу;
      - катер идёт только по воде, машина в воде глохнет;
      - пробитый корпус катера теряет плавучесть;
      - брызги и след от винта видны и не стоят больше N мс на кадр.

  - title: "Дым и жар: заслонение видимости и подсветка сцены"
    milestone: "Волна 4 — Огонь и вода"
    labels: ["волна:4", "ядро", "рендер"]
    status: done
    body: |
      Дым — данные, а не спрайты: поле плотности с метровой ячейкой,
      подъёмом, сносом ветром и распадом. Оно садит видимость в кадре
      (дальность тумана падает обратно плотности) и уводит луч
      инструмента тем сильнее, чем гуще завеса между глазом и целью.
      Увод детерминирован по сиду.

      **Приёмка**
      - плотный дым реально мешает целиться, а не просто рисуется поверх;
      - очаги дают динамический свет с мерцанием;
      - при 500 горящих вокселях кадр остаётся в бюджете.

  # ---------------------------------------------------------------- волна 5
  - title: "Интерфейс физического бэкенда и headless-реализация"
    milestone: "Волна 5 — Твёрдые тела"
    labels: ["волна:5", "ядро"]
    status: done
    body: |
      Один интерфейс, две реализации: детерминированный дублёр для тестов
      и серверной валидации, Rapier — в браузере.

      **Приёмка**
      - тесты физики не требуют WASM;
      - тело падает, останавливается на земле и засыпает;
      - импульс меняет скорость обратно пропорционально массе;
      - радиальный импульс не достаёт за радиус.

  - title: "Rapier: компаунд-коллайдеры из жадной декомпозиции"
    milestone: "Волна 5 — Твёрдые тела"
    labels: ["волна:5", "ядро", "производительность"]
    status: done
    body: |
      Декомпозиция вокселей в боксы готова и покрыта тестами. Нужен
      адаптер: сборка compound collider, масса и тензор инерции из вокселей,
      пересборка коллайдера после разрушения.

      **Приёмка**
      - обломок из 5000 вокселей даёт десятки боксов, а не тысячи;
      - пересборка коллайдера идёт только для грязных тел;
      - масса тела совпадает с суммой масс вокселей в пределах 1%;
      - 200 одновременных обломков держат 60 кадров/с.

  - title: "Сон и пробуждение тел, ограничение числа активных обломков"
    milestone: "Волна 5 — Твёрдые тела"
    labels: ["волна:5", "ядро", "производительность"]
    status: done
    body: |
      **Приёмка**
      - уснувшее тело не считается солвером и не двигается;
      - удар будит тело и соседей;
      - при превышении лимита самые мелкие и дальние обломки сливаются
        в статическую геометрию, а не удаляются на глазах у игрока.

  - title: "Урон от удара: масса и импульс решают, кто кого"
    milestone: "Волна 5 — Твёрдые тела"
    labels: ["волна:5", "ядро"]
    status: done
    body: |
      **Приёмка**
      - тяжёлая плита при падении крошится и крошит то, на что упала;
      - лёгкий ящик с малой высоты не ломает ничего;
      - радиус воронки растёт с импульсом.

  # ---------------------------------------------------------------- волна 6
  - title: "Жадное меширование воксельных форм"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "рендер", "производительность"]
    status: done
    body: |
      Один квад на максимальный прямоугольник одинаковых граней. Наивный
      куб-на-воксель даёт миллионы треугольников там, где хватает тысяч.

      **Приёмка**
      - сплошная стена 100×100 вокселей даёт один квад на сторону;
      - число треугольников карты «Порт» в старте укладывается в бюджет;
      - меш совпадает по объёму с исходной сеткой (тест на герметичность).

  - title: "Очередь ремеша в web worker с приоритетом по расстоянию"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "рендер", "производительность"]
    status: done
    body: |
      **Приёмка**
      - ремеш не блокирует кадр: просадка при массовом разрушении не больше N мс;
      - ближние чанки перестраиваются раньше дальних;
      - отменённые задачи не тратят время воркера.

  - title: "Материалы и палитра: PBR, стекло, светящееся, краска"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "рендер"]
    status: done
    body: |
      Цельный оригинальный воксельный стиль: читаемые силуэты, объём,
      согласованные масштаб и ракурс.

      **Приёмка**
      - материал воксела читается по цвету и блику без подписи;
      - стекло прозрачное и отражает, металл бликует, грунт матовый;
      - слой краски виден поверх материала и не меняет его вид иначе.

  - title: "Освещение с имитацией трассировки и запечённое затенение"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "рендер"]
    status: done
    body: |
      Небесный свет считается по вокселям: колонки сверху вниз плюс боковое
      растекание с затуханием. Пересчитывается полосой вокруг разрушения, а
      не целиком, поэтому свет из пробитой крыши падает на пол в том же
      кадре. Уровень света едет в вершинах меша и гасит рассеянный свет в
      шейдере — внутри склада темно, снаружи нет.

      **Приёмка**
      - солнце с мягкой тенью, ночной вариант с прожекторами порта;
      - AO по вокселям пересчитывается вместе с ремешем;
      - при разрушении стены свет попадает внутрь в том же кадре.

  - title: "Эффекты: осколки, пыль, искры, огонь, брызги"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "рендер"]
    status: done
    body: |
      Частицы берут материал и позицию из результата разрушения, а не
      выдумывают их: осколок кирпича — кирпичного цвета.

      **Приёмка**
      - у каждого применимого действия есть свой эффект;
      - выборка обломков ограничена и не растёт с объёмом разрушения;
      - при массовом обрушении частицы не съедают кадр.

  - title: "Камера и постобработка: экспозиция, вода, тряска"
    milestone: "Волна 6 — Рендер"
    labels: ["волна:6", "игра", "рендер"]
    status: done
    body: |
      Тряска — модель травмы: событие добавляет её по расстоянию, она
      затухает сама, смещение считается как квадрат. Трясётся только
      камера: направление выстрела берётся от честного курса игрока,
      поэтому тряска не мешает целиться. Под водой картинка синеет и
      садится по дальности, качество переключается на лету.

      **Приёмка**
      - под водой картинка меняется явно и обратимо;
      - взрыв даёт тряску, которая не мешает целиться;
      - настройки качества переключаются без перезагрузки.

  # ---------------------------------------------------------------- волна 7
  - title: "Ввод и камера от первого лица с захватом указателя"
    milestone: "Волна 7 — Игрок и инструменты"
    labels: ["волна:7", "приложение"]
    status: done
    body: |
      **Приёмка**
      - мышь захватывается по клику и отпускается по Esc;
      - чувствительность настраивается и сохраняется;
      - раскладка WASD/стрелки работает независимо от языка ввода.

  - title: "Контроллер игрока в браузере: шаг по завалам, вода, присед"
    milestone: "Волна 7 — Игрок и инструменты"
    labels: ["волна:7", "игра"]
    status: done
    body: |
      Коробка против вокселей, разбор по осям, автоматический шаг вверх.
      Именно шаг вверх делает разрушенный уровень проходимым.

      **Приёмка**
      - игрок сам заходит на низкую ступеньку и не перелезает высокий уступ;
      - на большой скорости не протуннелирует стену;
      - под низким потолком нельзя встать из приседа;
      - в воде замедляется и всплывает по пробелу.

  - title: "Применение инструментов из приложения: прицел, откат, расход"
    milestone: "Волна 7 — Игрок и инструменты"
    labels: ["волна:7", "игра"]
    status: done
    body: |
      **Приёмка**
      - каждый из семи инструментов делает ровно то, что заявлено;
      - откат и расходники соблюдаются, промах не тратит заряд;
      - цели миссии не разрушаются никаким инструментом;
      - взрывчатка ставится и подрывается по таймеру и по детонатору;
      - доски строятся в два клика и попадают под структурную целостность.

  - title: "HUD: таймер тревоги, инструмент, расходники, цели"
    milestone: "Волна 7 — Игрок и инструменты"
    labels: ["волна:7", "приложение"]
    status: done
    body: |
      **Приёмка**
      - таймер читается боковым зрением и меняет вид на последних 10 секундах;
      - видно активный инструмент, ступень и остаток расходника;
      - список целей показывает взятые и оставшиеся;
      - HUD не перекрывает прицел и не мешает планировать.

  - title: "Звук: инструменты, материалы, обрушение, тревога"
    milestone: "Волна 7 — Игрок и инструменты"
    labels: ["волна:7", "приложение"]
    status: done
    body: |
      **Приёмка**
      - удар по дереву, кирпичу и стали звучит по-разному;
      - сирена тревоги слышна отовсюду и нарастает к концу таймера;
      - обрушение звучит соразмерно массе;
      - звук можно выключить одной клавишей.

  # ---------------------------------------------------------------- волна 8
  - title: "Управление техникой: разгон, руль, тормоз, камера"
    milestone: "Волна 8 — Техника"
    labels: ["волна:8", "игра"]
    status: done
    body: |
      Кинематическая модель: предсказуемая и не разваливается, когда под
      колёсами исчезает половина уровня.

      **Приёмка**
      - легковая, пикап, катер, экскаватор и бульдозер управляются;
      - руль работает только на ходу;
      - катер идёт только по воде, машина в воде глохнет;
      - разбитый корпус больше не едет.

  - title: "Техника против вокселей: таран, отвал, ковш"
    milestone: "Волна 8 — Техника"
    labels: ["волна:8", "игра"]
    status: done
    body: |
      **Приёмка**
      - пикап на разгоне пробивает кирпичную стену, без разгона — упирается;
      - сталь корпусом не берётся ни на какой скорости;
      - бульдозер и экскаватор расчищают завал отвалом стоя;
      - щуп столкновения сидит на бампере, а не в трёх метрах перед ним.

  - title: "Посадка, высадка и переключение камеры"
    milestone: "Волна 8 — Техника"
    labels: ["волна:8", "игра", "приложение"]
    status: done
    body: |
      **Приёмка**
      - сесть можно только рядом и только в целую технику;
      - высадка не роняет игрока внутрь геометрии;
      - камера от третьего лица не проваливается сквозь стены;
      - разрушение техники под игроком высаживает его безопасно.

  - title: "Эвакуация транспортом: погрузка целей и отъезд"
    milestone: "Волна 8 — Техника"
    labels: ["волна:8", "игра"]
    status: done
    body: |
      Расстановка транспорта — часть цикла: подогнал пикап к дыре, закинул
      сейф, уехал.

      **Приёмка**
      - цель можно положить в кузов, и она едет вместе с машиной;
      - въезд машины с целями в зону эвакуации засчитывается;
      - выпавшая на ходу цель остаётся в мире, а не исчезает.

  # ---------------------------------------------------------------- волна 9
  - title: "Конечный автомат ограбления и таймер ровно 60 секунд"
    milestone: "Волна 9 — Игровая логика"
    labels: ["волна:9", "игра"]
    status: done
    body: |
      Разведка без таймера → взятие первой проводной цели → ровно 60 секунд →
      вертолёт и мгновенный провал. Сложность — только это число.

      **Приёмка**
      - на 59.99 секунде ещё живы, на 60.0 — провал;
      - доставка на последней десятой секунде засчитывается;
      - провал по таймеру не платит ни рубля;
      - непроводная ценность тревогу не поднимает.

  - title: "Цели, ценности и зона эвакуации"
    milestone: "Волна 9 — Игровая логика"
    labels: ["волна:9", "игра"]
    status: done
    body: |
      **Приёмка**
      - несомая цель едет за игроком, брошенная остаётся на месте;
      - доставка всех обязательных целей плюс игрок в зоне = успех;
      - ценности идут в кассу сверх обязательных целей;
      - нельзя нести больше, чем разрешено конфигурацией миссии.

  - title: "Триггеры уровня: кабель сигнализации, зоны, чекпойнты"
    milestone: "Волна 9 — Игровая логика"
    labels: ["волна:9", "игра"]
    status: done
    body: |
      Никакого ИИ и никаких охранников: вся охранная система — это объёмы
      и события входа-выхода.

      **Приёмка**
      - вход и выход шлют события ровно один раз;
      - одноразовый триггер срабатывает один раз;
      - разные сущности отслеживаются независимо.

  - title: "Перерезанный кабель поднимает тревогу до взятия цели"
    milestone: "Волна 9 — Игровая логика"
    labels: ["волна:9", "игра"]
    status: done
    body: |
      Ручной запуск тревоги в автомате есть. Нужно связать его с разрушением
      вокселей кабеля: задел кабель кувалдой — сирена.

      **Приёмка**
      - разрушение вокселей в объёме кабеля запускает таймер;
      - аккуратный обход кабеля позволяет вынести цель тихо;
      - повторное разрушение уже сработавшего кабеля ничего не меняет.

  - title: "Вертолёт и катер преследования: визуал провала"
    milestone: "Волна 9 — Игровая логика"
    labels: ["волна:9", "игра", "приложение"]
    status: done
    body: |
      По истечении таймера — мгновенный провал. Он должен читаться как
      событие, а не как надпись на чёрном экране.

      **Приёмка**
      - на последних секундах слышен и виден подлёт;
      - момент провала однозначен и не оставляет ощущения несправедливости;
      - рестарт доступен сразу, без перезагрузки страницы.

  # ---------------------------------------------------------------- волна 10
  - title: "Экономика и прокачка: три ступени на каждый инструмент"
    milestone: "Волна 10 — Хаб и прогрессия"
    labels: ["волна:10", "игра"]
    status: done
    body: |
      **Приёмка**
      - прокачка списывает ровно цену и поднимает ступень;
      - без денег ничего не списывается;
      - на максимуме прокачка отклоняется;
      - прокачка доливает расходник до нового потолка.

  - title: "Сохранение профиля и рекордов"
    milestone: "Волна 10 — Хаб и прогрессия"
    labels: ["волна:10", "игра"]
    status: done
    body: |
      **Приёмка**
      - профиль переживает круговой рейс через JSON;
      - битое или чужое по версии сохранение даёт чистый профиль, а не падение;
      - рекорд обновляется только при улучшении;
      - бесконечные рекорды переживают JSON.

  - title: "Хаб: интерфейс магазина, брифинг, выбор миссии"
    milestone: "Волна 10 — Хаб и прогрессия"
    labels: ["волна:10", "приложение"]
    status: done
    body: |
      Один хаб, из него — на миссию и в песочницу.

      **Приёмка**
      - видно деньги, ступени и цены;
      - брифинг миссии читается за 15 секунд и объясняет правила;
      - рекорды по времени под тревогой показываются рядом с миссией.

  - title: "Режим песочницы: свободное разрушение без таймера"
    milestone: "Волна 10 — Хаб и прогрессия"
    labels: ["волна:10", "игра"]
    status: done
    body: |
      **Приёмка**
      - в песочнице нет таймера и расходников;
      - деньги не начисляются;
      - уровень перезапускается одной клавишей;
      - переключение сида пожара и множителя нагрузки доступно из интерфейса.

  # ---------------------------------------------------------------- волна 11
  - title: "Карта «Порт»: геометрия, которая держится сама"
    milestone: "Волна 11 — Карта M"
    labels: ["волна:11", "контент"]
    status: done
    body: |
      Индустриальная зона: набережная, склад, офис, кран, причал, штабель
      контейнеров, забор. Без сложных многоуровневых подвалов.

      **Приёмка**
      - полный структурный расчёт на старте не даёт ни одного обломка;
      - точка спавна стоит на твёрдом и внутри зоны эвакуации;
      - в гавани есть вода, и она пассивна;
      - есть регрессионный тест, который ловит любую просадку геометрии.

  - title: "Наполнение карты: маршруты, ценности, укрытия"
    milestone: "Волна 11 — Карта M"
    labels: ["волна:11", "контент"]
    status: done
    body: |
      Реиграбельность идёт от вариантов маршрута, поиска ценностей и
      улучшения времени спидрана.

      **Приёмка**
      - минимум три разных маршрута отхода укладываются в 60 секунд;
      - все пять ценностей достижимы, но не по одному маршруту;
      - на карте есть хотя бы одна задача, решаемая только техникой,
        и хотя бы одна — только досками.

  - title: "Формат карты и внешний редактор уровней"
    milestone: "Волна 11 — Карта M"
    labels: ["волна:11", "контент"]
    status: done
    body: |
      Карта — данные, а не код: `packages/game/src/levels/port.json` в
      формате `tvox-level`. Геометрия описана операциями (залить коробку,
      коробка здания, балки, сетка, ломаная, сырые воксели), координаты в
      метрах, материалы по именам. Разбор проверяет файл до сборки и
      называет поле: `volumes[2].ops[7].mat: нет материала «адамантий»`.
      Приложение принимает карту перетаскиванием файла в окно, `.vox`
      из MagicaVoxel читается и превращается в готовую песочницу.

      **Приёмка**
      - карта грузится из файла, а не только собирается кодом;
      - правка геометрии не требует пересборки приложения;
      - импорт из распространённого воксельного формата работает
        хотя бы на чтение.

  # ---------------------------------------------------------------- волна 12
  - title: "Перф-бюджеты и регрессия производительности"
    milestone: "Волна 12 — Полировка и приёмка"
    labels: ["волна:12", "производительность", "тесты"]
    status: done
    body: |
      Приёмка требует регрессии производительности, а не ощущений.

      **Приёмка**
      - зафиксированы бюджеты: кадр, ремеш, структурный расчёт, огонь;
      - сценарий «взрыв максимальной ступени в складе» гоняется в CI
        и падает при превышении бюджета;
      - профиль сохраняется артефактом сборки.

  - title: "Видео состояний и ручная проверка при массовых разрушениях"
    milestone: "Волна 12 — Полировка и приёмка"
    labels: ["волна:12", "тесты"]
    status: partial
    body: |
      **Приёмка**
      - для каждого материала и каждого инструмента есть короткое видео
        состояний: цел → повреждён → разрушен;
      - есть запись полного обрушения склада в игровом масштабе;
      - чек-лист ручной проверки зафиксирован в репозитории.

  - title: "Стабильность длинной сессии: утечки, накопление обломков"
    milestone: "Волна 12 — Полировка и приёмка"
    labels: ["волна:12", "производительность"]
    status: done
    body: |
      **Приёмка**
      - час в песочнице с непрерывным разрушением не роняет вкладку;
      - число тел и объём памяти выходят на плато, а не растут линейно;
      - рестарт миссии полностью освобождает ресурсы прошлого прохода.

