name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: План issues (валидация waves.yaml)
        run: npm run issues:plan
      - name: Тесты и покрытие
        run: npm run test:cov
      - name: Сборка
        run: npm run build
      - name: Дымовой прогон в браузере
        run: |
          npx playwright install --with-deps chromium
          node tools/smoke/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
